<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light">
<meta name="description" content="Interactieve kaart van de musea, tentoonstellingen en vikinglocaties van Reykjavík en omgeving.">
<meta property="og:title" content="Rey 6 tot 11 nov">
<meta property="og:description" content="Interactieve kaart van musea, tentoonstellingen en vikinglocaties in en rond Reykjavík.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B3FA0'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23fff' stroke-width='2.5'/%3E%3C/svg%3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Rey 6 tot 11 nov</title>
<link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://b.basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://c.basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://d.basemaps.cartocdn.com" crossorigin>
<link rel="preconnect" href="https://unpkg.com" crossorigin>
<link id="lcss" rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      onerror="this.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css'">
<style>
:root{
  --inkt:#171A1F; --papier:#EEF1F4; --paneel:#FFF; --steen:#6E7684;
  --aalto:#1B3FA0; --geo:#B36A15; --viking:#6B3FA0; --rand:rgba(23,26,31,.13);
  --sheet:58dvh; --peek:92px; --safe:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,a,input{touch-action:manipulation}
html,body{height:100%;height:100dvh;margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--papier);color:var(--inkt);font-family:var(--font);font-size:15px;line-height:1.45}

/* ---- kop ---- */
#kop{
  position:fixed;top:0;left:0;right:0;z-index:900;background:var(--paneel);
  border-bottom:1px solid var(--rand);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px;
}
#kop h1{font-size:15px;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
#kop h1 span{font-weight:400;color:var(--steen);font-size:13px}
#lagen{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tog{
  position:relative;border:1px solid var(--rand);background:var(--paneel);color:var(--steen);
  padding:11px 4px 10px;border-radius:10px;font:inherit;font-size:13.5px;font-weight:500;
  letter-spacing:-.01em;min-height:44px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;line-height:1;overflow:hidden;
  transition:color .14s,background .14s,border-color .14s;
}
.tog::before{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:var(--laagkleur,var(--inkt));opacity:.22;transition:opacity .14s,height .14s;
}
.tog[aria-pressed="true"]{
  color:var(--laagkleur,var(--inkt));
  background:color-mix(in srgb,var(--laagkleur,var(--inkt)) 9%,var(--paneel));
  border-color:color-mix(in srgb,var(--laagkleur,var(--inkt)) 38%,var(--paneel));
  font-weight:600;
}
.tog[aria-pressed="true"]::before{opacity:1;height:4px}
.tog:active{transform:scale(.975)}
.tog[data-laag="musea"]{--laagkleur:#1B3FA0}
.tog[data-laag="expo"]{--laagkleur:#B36A15}
.tog[data-laag="vik"]{--laagkleur:#6B3FA0}
.tog[data-laag="eten"]{--laagkleur:#B03030}
.tog[data-laag="bier"]{--laagkleur:#7A5A1E}
.tog[data-laag="wink"]{--laagkleur:#2F7A6B}

/* ---- kaart ---- */
#kaart{position:fixed;inset:0;background:#DCE3E8;z-index:1}

/* ---- bottom sheet ---- */
#sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:950;background:var(--paneel);
  border-top:1px solid var(--rand);border-radius:16px 16px 0 0;
  box-shadow:0 -3px 18px rgba(23,26,31,.13);
  height:var(--sheet);max-height:640px;transform:translateY(calc(var(--sheet) - var(--peek)));
  transition:transform .22s ease;display:flex;flex-direction:column;
  padding-bottom:var(--safe);touch-action:none;
}
#sheet.open{transform:translateY(0)}
#greep{padding:8px 14px 10px;flex:none;cursor:grab}
#greep .bar{width:44px;height:5px;border-radius:2px;background:var(--rand);margin:0 auto 8px}
#greep .rij{display:flex;align-items:center;gap:10px}
#greep .titel{font-weight:700;font-size:15px}
#greep .telling{color:var(--steen);font-size:13.5px;margin-left:auto;font-variant-numeric:tabular-nums}
#zoek{
  margin:0 14px 8px;padding:10px 12px;border-radius:9px;border:1px solid var(--rand);
  background:var(--papier);color:var(--inkt);font:inherit;font-size:16px;flex:none;
}
#zoek:focus{outline:2px solid var(--aalto);outline-offset:1px}
#lijst{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;padding-bottom:20px;overscroll-behavior:contain}
.item{
  width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rand);
  color:inherit;font:inherit;padding:13px 14px;min-height:64px;cursor:pointer;
  display:flex;align-items:center;gap:12px;
}
.item:active{background:rgba(27,63,160,.08)}
.item .ico{font-size:20px;flex:none;width:26px;text-align:center}
.item .tekst{flex:1;min-width:0;display:block}
.item .naam{font-weight:600;font-size:15px;line-height:1.25;display:block}
.item .meta{color:var(--steen);font-size:12.5px;margin-top:3px;display:flex;gap:7px;align-items:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .streep{width:3px;height:12px;border-radius:2px;flex:none}
.item .afstand{flex:none;font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;color:var(--steen)}
.item .afstand small{font-size:10.5px;font-weight:400;display:block;text-align:right;margin-top:-2px}
.merk{margin-left:5px;font-size:11px}
.merk.expo{color:var(--geo)} .merk.vik{color:var(--viking)} .merk.winter{color:var(--aalto)}
#voet{padding:14px;color:var(--steen);font-size:11.5px;border-top:1px solid var(--rand)}
#voet button{background:none;border:0;color:var(--aalto);font:inherit;font-size:11.5px;padding:6px 0;cursor:pointer;text-decoration:underline}

/* ---- popups ---- */
.leaflet-popup-content-wrapper{background:var(--paneel);color:var(--inkt);border-radius:10px;border:1px solid var(--rand);box-shadow:0 4px 20px rgba(23,26,31,.18)}
.leaflet-popup-content{margin:12px 14px;font-size:13.5px;line-height:1.45}
.leaflet-container a.leaflet-popup-close-button{width:34px;height:34px;font-size:20px;padding:6px 6px 0 0;color:var(--steen)}
.pop-cat{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--steen)}
.pop-naam{font-weight:700;font-size:16px;margin:2px 0 1px;line-height:1.2}
.pop-isl{color:var(--steen);font-size:12.5px;font-style:italic;margin-bottom:5px}
.pop-adres{color:var(--steen);font-size:12.5px;margin-bottom:6px}
.pop-links{margin-top:10px;display:flex;flex-direction:column;gap:2px}
.pop-links a{color:var(--aalto);font-size:13.5px;padding:6px 0;display:inline-block}
.pop-expo{margin-top:8px;padding:7px 9px;border-left:2px solid var(--geo);background:rgba(179,106,21,.10);font-size:12.5px}
.pop-winter{margin-top:8px;padding:7px 9px;border-left:2px solid var(--aalto);background:rgba(27,63,160,.09);font-size:12.5px}
.leaflet-control-attribution{background:rgba(255,255,255,.82)!important;color:var(--steen)!important;font-size:10px!important}
.leaflet-bottom.leaflet-right{margin-bottom:calc(var(--peek) - 8px)}
.leaflet-control-zoom{display:none}
.gv{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:17px;
  background:var(--paneel);border:2.5px solid #B03030;border-radius:50%;box-shadow:0 1px 4px rgba(23,26,31,.35);line-height:1}
.marker{width:26px;height:26px;display:flex;align-items:center;justify-content:center}
.marker i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(23,26,31,.4);display:block}
.marker.thuis i{width:15px;height:15px;border-radius:3px;transform:rotate(45deg)}
#hier{
  position:fixed;right:12px;bottom:calc(var(--peek) + 16px + var(--safe));z-index:940;width:46px;height:46px;
  border-radius:50%;border:1px solid var(--rand);background:var(--paneel);font-size:19px;
  box-shadow:0 2px 10px rgba(23,26,31,.16);cursor:pointer;line-height:1;
}
@media (min-width:900px){
  #lagen{grid-template-columns:repeat(8,minmax(0,100px))}
  :root{--sheet:100dvh}
  #sheet{left:auto;right:0;top:0;width:380px;height:100dvh;border-radius:0;border-left:1px solid var(--rand);border-top:0;transform:none;box-shadow:none;padding-top:64px}
  #greep .bar{display:none}
  #kaart{right:380px}
  .leaflet-control-zoom{display:block}
  #hier{right:396px;bottom:20px}
  .leaflet-bottom.leaflet-right{margin-bottom:0}
}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}

/* ---- bus-laag en vervoerpaneel ---- */
.tog[data-laag="air"]{--laagkleur:#C2185B}
.tog[data-actie="vervoer"]{--laagkleur:#171A1F}
#vervoer{
  position:fixed;left:0;right:0;bottom:0;top:var(--kopH,112px);z-index:960;
  background:var(--papier);display:none;flex-direction:column;border-top:1px solid var(--rand);
}
#vervoer.open{display:flex}
.vkopbalk{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--paneel);border-bottom:1px solid var(--rand);flex:none}
.vkopbalk strong{font-size:15px}
#vsluit{margin-left:auto;width:44px;height:44px;border-radius:10px;border:1px solid var(--rand);background:var(--paneel);color:var(--inkt);font-size:18px;cursor:pointer}
.vtabs{display:flex;gap:7px;padding:8px 12px;background:var(--paneel);border-bottom:1px solid var(--rand);flex:none}
.vtab{flex:1;min-height:44px;border:1px solid var(--rand);border-radius:10px;background:var(--paneel);color:var(--steen);font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.vtab[aria-pressed="true"]{color:#2A6F97;background:color-mix(in srgb,#2A6F97 9%,var(--paneel));border-color:color-mix(in srgb,#2A6F97 38%,var(--paneel));font-weight:600}
#vinhoud{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:12px 12px calc(28px + var(--safe))}
.vk{background:var(--paneel);border:1px solid var(--rand);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.vk.eerste{border-color:#2A6F97;box-shadow:0 0 0 1px #2A6F97 inset}
.vk.ok{border-color:#2F7A6B;box-shadow:0 0 0 1px #2F7A6B inset}
.vk.vroeg,.vk.laat{opacity:.78}
.vt{font-weight:700;font-size:15px;margin-bottom:8px}
.vkop2{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--steen);margin:14px 2px 6px}
.vform{display:flex;gap:10px;flex-wrap:wrap}
.vform label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--steen);flex:1;min-width:120px}
.vform input,.vform select{font:inherit;font-size:16px;color:var(--inkt);padding:10px 12px;border-radius:9px;border:1px solid var(--rand);background:var(--papier);min-height:44px}
.vnoot{font-size:12.5px;color:var(--steen);margin-top:9px;line-height:1.4}
.vnoot b{color:var(--inkt)}
.vrij{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.vuur{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.vdoel{font-weight:600;font-size:14.5px}
.vwacht{margin-left:auto;font-size:12px;color:var(--steen)}
.vsub{font-size:13px;color:var(--steen);margin-top:6px;line-height:1.5}
.vsub b{color:var(--inkt)}
.vwaarsch{margin-top:8px;padding:7px 9px;border-left:2px solid var(--geo);background:rgba(179,106,21,.10);font-size:12.5px}
.vknoppen{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.vknoppen button{flex:1;min-width:110px;min-height:44px;border:1px solid var(--rand);border-radius:10px;background:var(--paneel);color:#2A6F97;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer}
.vtabel{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.vtabel th{font-size:11px;color:var(--steen);font-weight:500;text-align:right;padding:2px 4px 6px}
.vtabel th:first-child,.vtabel td:first-child{text-align:left}
.vtabel td{padding:8px 4px;border-top:1px solid var(--rand);text-align:right;vertical-align:top}
.vtabel small{color:var(--steen);font-size:11px}
.vlijst{margin:0;padding-left:18px;font-size:13px;line-height:1.5}
.vlijst li{margin-bottom:5px}
@media (min-width:900px){
  #vervoer{right:380px}
}

.bordrij{display:flex;align-items:center;flex-wrap:wrap;gap:4px 9px;margin:7px 0 2px}
.bord{display:inline-flex;align-items:baseline;gap:7px;background:#171A1F;color:#FFB300;border-radius:5px;padding:5px 9px;font:700 13.5px/1.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em;box-shadow:0 0 0 1px #3A3F48 inset}
.bord b{font-size:15px;color:#fff;background:#2A6F97;border-radius:3px;padding:2px 5px}
.bordx{font-size:12.5px;color:var(--steen)}
.bordnoot{font-size:12px;color:var(--steen);margin-top:6px;line-height:1.4}

.airrij{font-size:13px;line-height:1.35;margin:4px 0}
.airrij b{display:inline-block;min-width:18px;text-align:center;background:#C2185B;color:#fff;border-radius:9px;padding:0 5px;font-size:11.5px}
.airrij.alt b{background:#8EA0A8}
.airrij.alt{opacity:.85}
.airtijd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.airrij i{color:var(--steen);font-size:12px}
.airnaar{display:block;font-size:12px;color:var(--steen);margin-left:24px}
</style>
</head>
<body>

<div id="kaart"></div>

<header id="kop">
  <h1>Rey 6 tot 11 nov <span>· 2026</span></h1>
  <div id="lagen">
    <button class="tog" data-laag="musea" aria-pressed="true">Musea</button>
    <button class="tog" data-laag="expo" aria-pressed="true">Expo’s</button>
    <button class="tog" data-laag="vik" aria-pressed="false">Viking</button>
    <button class="tog" data-laag="eten" aria-pressed="false">Eten</button>
    <button class="tog" data-laag="bier" aria-pressed="false">Bier</button>
    <button class="tog" data-laag="wink" aria-pressed="false">Winkels</button>
    <button class="tog" data-laag="air" aria-pressed="false">Airwaves</button>
    <button class="tog" data-actie="vervoer" aria-pressed="false">Vervoer</button>
  </div>
</header>

<button id="hier" title="Mijn positie" aria-label="Mijn positie">◎</button>

<section id="sheet" aria-label="Lijst met locaties">
  <div id="greep">
    <div class="bar"></div>
    <div class="rij"><span class="titel">Lijst</span><span class="telling" id="telling"></span></div>
  </div>
  <input id="zoek" type="search" placeholder="Zoek op naam of adres" aria-label="Zoeken" enterkeyhint="search">
  <div id="lijst"></div>
  <div id="voet">
    <div id="status">Posities laden…</div>
    <button id="opnieuw" type="button">Posities opnieuw ophalen</button>
    <div style="margin-top:6px">❄ beperkt open in de winter · ● tentoonstelling · ◆ vikingtijd · 🚌 bushalte · 🎶 Airwaves<br>Tik een knop bovenaan om een laag aan of uit te zetten<br>
    Kaart © OpenStreetMap, © CARTO · afstanden hemelsbreed</div>
  </div>
</section>

<section id="vervoer" aria-label="Vervoer KEF en Reykjavík">
  <div class="vkopbalk"><strong>Vervoer KEF ↔ Reykjavík</strong><button id="vsluit" type="button" aria-label="Sluiten">✕</button></div>
  <div class="vtabs">
    <button class="vtab" type="button" data-tab="aan" aria-pressed="true">Vr 6 nov</button>
    <button class="vtab" type="button" data-tab="terug" aria-pressed="false">Di 10 nov</button>
    <button class="vtab" type="button" data-tab="info" aria-pressed="false">Info</button>
  </div>
  <div id="vinhoud"></div>
</section>

<script>
/*
 Musea Reykjavík — interactieve kaart
 Kaartlaag: OpenStreetMap / CARTO Positron.  Geocoding: Nominatim (OpenStreetMap),
 gebruikt volgens hun policy: max. 1 verzoek per seconde, resultaten lokaal gecached.
 Gegevens over musea: visitreykjavik.is, listasafn.is, listasafnreykjavikur.is,
 nordichouse.is, thjodminjasafn.is, borgarsogusafn.is, i8.is, vikingworld.is, landnam.is,
 straeto.is, flybus.is, icelandairwaves.is.
*/
const CATS = {
  kunst:   {label:"Kunst",              kleur:"#1B3FA0"},
  hist:    {label:"Geschiedenis",       kleur:"#B36A15"},
  natuur:  {label:"Natuur & beleving",  kleur:"#3E6B48"},
  aalto:   {label:"Aalto / bibliotheek",kleur:"#00A3C4"},
  extra:   {label:"Curiosa",            kleur:"#8E3F6B"}
};

const M = [
 {n:"Nordic House — Norræna húsið", isl:"Aalto-bibliotheek, 1968", c:"aalto", g:"Sturlugata 5, Reykjavík", ll:[64.1387,-21.9497],
  a:"Sturlugata 5, Vatnsmýri",
  d:"Het enige gebouw van Alvar Aalto in IJsland. Blauw keramisch dak, centrale lichtkoker in de bibliotheek, alle meubels en lampen van Aalto zelf. 30.000+ titels in zeven Noordse talen.",
  u:"https://nordichouse.is/en/", w:"Di–zo 10–17u, maandag gesloten."},

 {n:"Ásmundarsalur", isl:"Beste galerie volgens Grapevine", c:"kunst", g:"Freyjugata 41, Reykjavík", ll:[64.1420,-21.9280],
  a:"Freyjugata 41", d:"Kunsthal met wisselende exposities; beneden een filiaal van Reykjavík Roasters. Niet te verwarren met Ásmundarsafn.",
  u:"https://asmundarsalur.is", vfl:true},
 {n:"Marshallhúsið", isl:"Nýlistasafnið, Kling & Bang, Þula, i8 Grandi", c:"kunst", g:"Marshallhúsið, Reykjavík", ll:[64.1546,-21.9550],
  a:"Grandagarður 20, Grandi", d:"Oude visfabriek uit 1948, nu vier kunstruimtes onder één dak plus het atelier van Ólafur Elíasson en restaurant La Primavera. Tien minuten wandelen van jullie logement.",
  u:"https://i8.is/about", vfl:true},
 {n:"i8 Gallery", isl:"", c:"kunst", g:"Tryggvagata 16, Reykjavík", ll:[64.1492,-21.9418],
  a:"Tryggvagata 16", d:"Sinds 1995 de belangrijkste commerciële galerie van het land, tegenover Hafnarhús. Gratis binnenlopen.",
  u:"https://i8.is", vfl:true},
 {n:"Víkingaheimar", isl:"Viking World", c:"hist", g:"Víkingaheimar, Njarðvík", ll:[63.97602,-22.52847],
  a:"Víkingabraut 1, Njarðvík (Reykjanesbær)", d:"Gebouwd rond de Íslendingur, een replica op ware grootte van het Gokstadschip uit ±890, in 2000 van IJsland naar New York gezeild. Vlak bij de luchthaven Keflavík — te doen op de dag van aankomst of vertrek.",
  u:"https://www.vikingworld.is/", vfl:true},
 {n:"Landnámssetur Íslands", isl:"The Settlement Center", c:"hist", g:"Landnámssetur Íslands, Borgarnes", ll:[64.5385,-21.9210],
  a:"Brákarbraut 13–15, Borgarnes", d:"Twee tentoonstellingen met audiogids: de landname van IJsland, en de Egilssaga. In twee van de oudste huizen van Borgarnes, op een uur rijden noordwaarts.",
  u:"https://www.landnam.is/eng/", vfl:true},
 {n:"Þingvellir", isl:"Hakið-bezoekerscentrum", c:"hist", g:"Þingvellir visitor centre, Iceland", ll:[64.2559,-21.1300],

/* tijdtabel lijn 55, werkdagen, geldig vanaf 02.01.2026 (straeto.is)
   K = vertrek KEF, aankomst Fjörður, aankomst BSÍ (null = rit eindigt in Fjörður)
   B = vertrek BSÍ (null = rit begint in Fjörður), vertrek Fjörður, aankomst KEF */
const T55K=[["06:27","07:16","07:39"],["07:54","08:43","09:06"],["09:54","10:42",null],["11:54","12:42",null],["13:54","14:42",null],["14:54","15:43","16:06"],["15:54","16:43","17:06"],["16:54","17:43","18:06"],["17:54","18:42",null],["18:54","19:42",null],["20:54","21:42",null],["22:54","23:42",null]];
const T55B=[["06:28","06:50","07:34"],["08:28","08:50","09:34"],[null,"10:50","11:33"],[null,"12:50","13:33"],[null,"14:50","15:33"],[null,"15:50","16:33"],["16:28","16:50","17:34"],["17:28","17:50","18:34"],["18:28","18:50","19:34"],[null,"19:50","20:33"],[null,"21:50","22:33"],[null,"23:50","00:33"]];
const tm=s=>{const p=s.split(':');return (+p[0])*60+(+p[1]);};
const ts=n=>{n=((Math.round(n)%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');};
function mono(r){let p=-1;return r.map(x=>{if(x==null) return null;let v=tm(x);while(v<p) v+=1440;p=v;return v;});}
const RIT_K=T55K.map(mono), RIT_B=T55B.map(mono);

/* Alleen handbagage: ± 25 min van landing tot buiten bij de halte */
const NAAR_BUITEN=25;

/* Aankomst op KEF: welke Strætó-ritten haal je, en wanneer ben je bij het appartement?
   Vanaf BSÍ: te voet (± 25 min), stadsbus lijn 14 of 15 (geschat 10 tot 15 min rit + wachttijd) of taxi.
   Vanaf Fjörður: lijn 1 naar Skúlagata (geschat 35 tot 45 min) en ± 15 min lopen. */
function berekenAankomst(landStr){
  const land=tm(landStr), buiten=land+NAAR_BUITEN, ritten=[];
  RIT_K.forEach(r=>{
    if(r[0]<buiten+5) return;
    const bsi=r[2]!=null, aan=bsi?r[2]:r[1];
    ritten.push({dep:r[0],halte:bsi?'BSÍ':'Fjörður',aan:aan,wacht:r[0]-buiten,bsi:bsi,
      voet:bsi?aan+25:null,
      stad:bsi?[aan+17,aan+32]:null,
      taxi:bsi?aan+10:null,
      thuis:bsi?null:[aan+53,aan+63],
      laat:!bsi&&aan>=21*60});
  });
  return {buiten:buiten, ritten:ritten.slice(0,4),
    flybus:{vertrek:[land+35,land+45], bsi:[land+80,land+90], voet:[land+105,land+115],
            stad:[land+97,land+122], plus:[land+115,land+130]}};
}

/* Terugweg naar het hotel bij KEF, vertrek vanaf BSÍ.
   Ritten die in Fjörður starten (BSÍ-kolom leeg) vallen weg. Vertrek appartement:
   te voet naar BSÍ = 25 min + marge (38 min), stadsbus lijn 14 of 15 = 2 min lopen + wachttijd + rit + marge (50 min). */
function berekenTerug(vanStr,totStr){
  const van=tm(vanStr), tot=tm(totStr), ritten=[];
  RIT_B.forEach(r=>{
    if(r[0]==null) return;
    const kef=r[2], hotel=kef+6, dep=r[0];
    if(hotel<van-150||hotel>tot+150) return;
    ritten.push({dep:dep,kef:kef,hotel:hotel,
      status:hotel<van?'vroeg':(hotel>tot?'laat':'ok'),
      wegVoet:dep-38, wegBus:dep-50});
  });
  const bsi=[van-50,tot-50];
  return {ritten:ritten, geenInVenster:!ritten.some(x=>x.status==='ok'),
    flybus:{bsi:bsi, ophalen:[bsi[0]-30,bsi[1]-30], wegVoet:[bsi[0]-38,bsi[1]-38], wegBus:[bsi[0]-50,bsi[1]-50]}};
}

/* Leaflet laden met reservebron; pas daarna starten */
function laadLeaflet(klaar){
  if(window.L) return klaar();
  const bronnen=['https://unpkg.com/leaflet@1.9.4/dist/leaflet.js',
                 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'];
  (function volgende(i){
    if(i>=bronnen.length){
      document.getElementById('status').textContent=
        'De kaartbibliotheek kon niet geladen worden. Controleer de verbinding en herlaad de pagina.';
      document.getElementById('kaart').style.display='none';
      document.getElementById('sheet').classList.add('open');
      return;
    }
    const s=document.createElement('script');
    s.src=bronnen[i]; s.async=false;
    s.onload=klaar; s.onerror=()=>volgende(i+1);
    document.head.appendChild(s);
  })(0);
}
if(document.readyState==='loading')
  document.addEventListener('DOMContentLoaded',()=>laadLeaflet(start));
else laadLeaflet(start);

function afstand(a,b){
  const R=6371,r=Math.PI/180,dLat=(b[0]-a[0])*r,dLon=(b[1]-a[1])*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}

/* ---------- posities: cache eerst, netwerk pas als het moet ---------- */
const status=document.getElementById('status');
const melding=t=>status.textContent=t;

function leesCache(){ try{ return JSON.parse(localStorage.getItem(CACHE)||'{}'); }catch(e){ return {}; } }
function schrijfCache(o){ try{ localStorage.setItem(CACHE,JSON.stringify(o)); }catch(e){} }

function zetPositie(m,ll){
  m.ll=ll; m.km=afstand(vertrek,ll); m.exact=true; m.marker.setLatLng(ll);
  EXPO.forEach(e=>{ if(e.m===m&&e.ring) e.ring.setLatLng(ll); });
  VIKING.forEach(v=>{ if(v.m===m&&v.ring) v.ring.setLatLng(ll); });
}

async function posities(forceer){
  const cache=forceer?{}:leesCache();
  let uitCache=0;
  const alles=M.concat(GV,BIER,BUS,AIR);
  alles.forEach(m=>{ if(m.g&&cache[m.g]) { zetPositie(m,cache[m.g]); uitCache++; } });
  const todo=alles.filter(m=>m.g&&!cache[m.g]);
  teken();
  if(!todo.length){ melding(uitCache+' posities uit het geheugen — geen netwerk nodig'); return; }
  if(!navigator.onLine){ melding('Offline — posities bij benadering'); return; }
  let ok=0;
  for(let i=0;i<todo.length;i++){
    const m=todo[i];
    melding('Posities ophalen… '+(i+1)+'/'+todo.length+' (eenmalig)');
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(m.g));
      const j=await r.json();
      if(j&&j[0]){ const ll=[+j[0].lat,+j[0].lon]; cache[m.g]=ll; zetPositie(m,ll); ok++; }
    }catch(e){}
    await new Promise(r=>setTimeout(r,1100));
  }
  schrijfCache(cache); teken();
  melding(ok+' posities opgehaald en bewaard — de volgende keer laadt dit meteen');
}
document.getElementById('opnieuw').addEventListener('click',()=>posities(true));

const bordNoot='Bordjes: lijnnummer en eindhalte komen uit de routepagina\'s op straeto.is. Strætó publiceert de exacte tekst op de bus niet, dus ga vooral op het lijnnummer af. Voor lijn 14 en 15 is de richting afgeleid van de eindhalten (14 Grandi – Verzló, 15 Vesturbær – Mosfellsbær); Moovit noemt bij BSÍ voor lijn 15 een andere naam (Reykjavegur). Controleer het bord bij het instappen.';
const stadsBordHeen=bordenHtml([['14','Grandi','richting Grandi','Uitstappen: halte Mýrargata (1 tot 2 min lopen)'],['15','Vesturbær','richting Vesturbær','Uitstappen: halte Mýrargata (1 tot 2 min lopen)']]);

function formAan(){
  return '<div class="vk"><div class="vt">Vr 6 nov · KEF → Mýrargata 18</div>'+
    '<div class="vform"><label>Landing HV9121<input type="time" id="v-land" value="'+vst.land+'"></label></div>'+
    '<div class="vnoot">Alleen handbagage. Gepland: landing 16:20. Vul de echte landingstijd in als de vlucht vertraagd is.</div></div>'+
    '<div id="v-uit"></div>';
}
function uitAan(){
  const r=berekenAankomst(vst.land), f=r.flybus;
  let h='<div class="vk"><div class="vnoot">Je staat naar schatting om <b>'+ts(r.buiten)+'</b> buiten bij de halte.</div></div>';
  h+='<div class="vkop2">Strætó lijn 55 · instappen bij KEF Komur</div>';
  h+='<div class="vnoot" style="padding:0 4px 4px">Sinds 1 okt 2026 vertrekt lijn 55 bij de nieuwe halte KEF Komur aan de aankomstzijde, via een overdekte looproute. Kjóavellir is nu de halte van lijn 89.</div>';
  if(!r.ritten.length) h+='<div class="vk">Geen Strætó meer na dat uur. Neem de Flybus.</div>';
  r.ritten.forEach((x,i)=>{
    h+='<div class="vk rit'+(i===0?' eerste':'')+'"><div class="vrij"><span class="vuur">'+ts(x.dep)+'</span>'+
      '<span class="vdoel">→ '+x.halte+' '+ts(x.aan)+'</span><span class="vwacht">'+x.wacht+' min na buiten</span></div>'+
      bord('55',x.halte,'richting Reykjavík');

      h+='<div class="vsub"><b>Naar het appartement vanaf BSÍ</b><br>'+

        'Te voet (1,7 km): thuis <b>± '+ts(x.voet)+'</b> · taxi: thuis <b>± '+ts(x.taxi)+'</b></div>';
    } else {
      h+='<div class="vsub"><b>Naar het appartement vanaf Fjörður</b><br>'+
        'Lijn 1 naar Skúlagata, dan ± 15 min lopen: thuis <b>'+bereik(x.thuis[0],x.thuis[1])+'</b>'+
        bord('1','Skúlagata','richting centrum Reykjavík','Uitstappen: Skúlagata (± 15 min lopen)')+
        'Deze rit rijdt niet door tot BSÍ.</div>';
    }
    if(x.laat) h+='<div class="vwaarsch">Lijn 1 laat in de avond is niet nagekeken. De Flybus is zekerder.</div>';
    h+='</div>';
  });
  h+='<div class="vkop2">Flybus · geen vaste tijd</div>'+
    '<div class="vk rit"><div class="vrij"><span class="vuur">± '+ts(f.vertrek[0])+'–'+ts(f.vertrek[1])+'</span>'+
    '<span class="vdoel">→ BSÍ '+ts(f.bsi[0])+'–'+ts(f.bsi[1])+'</span></div>'+
    bord('Flybus','Reykjavík BSÍ','bordtekst niet bevestigd, herken de Flybus aan het logo')+
    '<div class="vsub"><b>Naar het appartement vanaf BSÍ</b><br>'+
    'Stadsbus lijn 14 of 15: thuis <b>'+bereik(f.stad[0],f.stad[1])+'</b>'+stadsBordHeen+
    'Te voet: thuis <b>'+bereik(f.voet[0],f.voet[1])+'</b><br>'+
    'Flybus+: minibus naar de halte Sjóminjasafnið (± 200 m van het appartement), thuis <b>'+bereik(f.plus[0],f.plus[1])+'</b><br>'+
    'Het ticket vanaf KEF is geldig op elke bus, ook bij vertraging.</div></div>';
  h+='<div class="vnoot" style="padding:0 4px 8px">'+stadsbusNoot+'</div>';
  h+='<div class="vnoot" style="padding:0 4px 8px">'+bordNoot+'</div>';
  h+=kaartKnoppen;
  document.getElementById('v-uit').innerHTML=h;
}

function formTerug(){
  return '<div class="vk"><div class="vt">Di 10 nov · BSÍ → KEF → Aurora Hotel</div>'+
    '<div class="vform"><label>Aan het hotel vanaf<input type="time" id="v-van" value="'+vst.van+'"></label>'+
    '<label>tot<input type="time" id="v-tot" value="'+vst.tot+'"></label></div>'+
    '<div class="vnoot">Alleen ritten vanaf BSÍ. Uitchecken vóór 10:00. Het hotel ligt ± 100 m van de terminal, opgegeven aankomsttijd 21:00.</div></div>'+
    '<div id="v-uit"></div>';
}
function uitTerug(){
  const r=berekenTerug(vst.van,vst.tot), f=r.flybus;
  const stat={ok:'past in het tijdvenster',vroeg:'te vroeg voor het tijdvenster',laat:'te laat voor het tijdvenster'};
  let h='<div class="vkop2">Strætó lijn 55 vanaf BSÍ naar KEF</div>';
  if(r.geenInVenster) h+='<div class="vwaarsch" style="margin:0 0 10px">Geen Strætó-rit vanaf BSÍ brengt je in dit tijdvenster aan het hotel. Na 18:28 start lijn 55 alleen nog in Fjörður. Neem voor het venster de Flybus.</div>';
  if(!r.ritten.length) h+='<div class="vk">Geen Strætó-rit vanaf BSÍ in of rond dit tijdvenster.</div>';
  r.ritten.forEach(x=>{
    h+='<div class="vk rit '+x.status+'"><div class="vrij"><span class="vuur">'+ts(x.dep)+'</span>'+
      '<span class="vdoel">BSÍ → KEF '+ts(x.kef)+'</span><span class="vwacht">'+stat[x.status]+'</span></div>'+
      bord('55','KEF – Airport','richting Keflavík')+
      '<div class="vsub">Aan het hotel <b>± '+ts(x.hotel)+'</b></div></div>';

  h+='<div class="vkop2">Flybus vanaf BSÍ · vertrekuur kiezen bij het boeken</div>'+
    '<div class="vk rit ok"><div class="vrij"><span class="vuur">'+ts(f.bsi[0])+'–'+ts(f.bsi[1])+'</span>'+
    '<span class="vdoel">vertrek BSÍ</span></div>'+
    bord('Flybus','KEF Airport','bordtekst niet bevestigd, personeel in BSÍ wijst de juiste bus aan')+
    '<div class="vsub">Kies in de boekingskalender op flybus.is een vertrek in dit venster. Een bus doet er ± 45 min over.<br>'+
    'Aan het hotel ± '+ts(f.bsi[0]+51)+' tot '+ts(f.bsi[1]+51)+'.<br>'+
    'De laatste Flybus vertrekt om 22:30. Bij een gemiste bus blijft het ticket geldig voor de volgende.</div></div>';
  h+='<div class="vnoot" style="padding:0 4px 8px">Aan het hotel stap je uit bij KEF Brottfarir, bij de terminal. Instappen kan daar niet.</div>';
  h+='<div class="vnoot" style="padding:0 4px 8px">Bordjes: lijnnummer en bestemming komen van straeto.is en flybus.is. De exacte tekst op de bus is niet gepubliceerd, dus ga op het lijnnummer af. Flybus-personeel in BSÍ wijst de juiste bus aan.</div>';
  h+=kaartKnoppen;

  return '<div class="vk"><div class="vt">Praktisch</div><ul class="vlijst">'+
    '<li>Klappið werkt niet zonder IJslands nummer. Betaal bij Strætó contactloos met bankkaart of Apple Pay/Google Pay, of bij de chauffeur.</li>'+
    '<li>Strætó op KEF: instappen bij KEF Komur (aankomstzijde, overdekte looproute), uitstappen bij KEF Brottfarir. Beide haltes zijn nieuw sinds 1 okt 2026. Flybus: buiten de aankomsthal.</li>'+
    '<li>10 nov: uitchecken vóór 10:00, vertrek pas na 17:00. Met alleen handbagage kunnen de tassen mee. BSÍ heeft volgens flybus.is ook bagageopslag.</li>'+
    '<li>Aurora Hotel: +354 595 1900. Laat het weten bij vertraging.</li></ul></div>'+
    '<div class="vk"><div class="vt">Nog niet bevestigd</div><ul class="vlijst">'+
    '<li>Stadsbus lijn 14 of 15 tussen BSÍ en de halte Mýrargata: de lijnen komen uit Moovit, rittijd (geschat 10 tot 15 min), en frequentie niet.</li>'+
    '<li>Rittijd lijn 1 tussen Skúlagata en Fjörður (schatting 35 tot 45 min), nodig voor de ritten die in Fjörður eindigen.</li>'+
    '<li>Exacte Flybus-vertrekuren vanaf BSÍ op 10 nov: zie flybus.is.</li>'+

    '<li>Alle haltes met ‘bij benadering’ staan niet op de exacte plek getekend, ook KEF Komur en KEF Brottfarir.</li></ul></div>'+
    '<div class="vnoot" style="padding:0 4px">Bronnen: straeto.is (tijdtabel lijn 55, werkdagen, geldig vanaf 02.01.2026; routepagina\'s lijn 1, 14, 15), stjornarradid.is (nieuwe KEF-haltes, 30.09.2026), flybus.is, Moovit (stadslijnen), Booking- en hotelbevestiging.</div>';
}

function toonTab(t){
  vst.tab=t;
  vtabs.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.tab===t)));
  if(t==='aan'){
    vin.innerHTML=formAan(); uitAan();
    document.getElementById('v-land').addEventListener('input',e=>{ if(e.target.value){vst.land=e.target.value; uitAan();} });
  } else if(t==='terug'){
    vin.innerHTML=formTerug(); uitTerug();
    document.getElementById('v-van').addEventListener('input',e=>{ if(e.target.value){vst.van=e.target.value; uitTerug();} });
    document.getElementById('v-tot').addEventListener('input',e=>{ if(e.target.value){vst.tot=e.target.value; uitTerug();} });
  } else {
    vin.innerHTML=viewInfo();
  }
  vin.scrollTop=0;
}
vtabs.forEach(b=>b.addEventListener('click',()=>toonTab(b.dataset.tab)));

function openVervoer(){ kopHoogte(); vp.classList.add('open'); zetBus(true); syncVknop(); toonTab(vst.tab); }
function sluitVervoer(){ vp.classList.remove('open'); syncVknop(); }
vknop.addEventListener('click',()=>vp.classList.contains('open')?sluitVervoer():openVervoer());
document.getElementById('vsluit').addEventListener('click',sluitVervoer);
addEventListener('keydown',e=>{ if(e.key==='Escape'&&vp.classList.contains('open')) sluitVervoer(); });

function toonKaart(w){
  sluitVervoer();
  if(w==='uit'){ zetBus(false); return; }
  zetBus(true);
  const ids={kef:['kef-s','kef-b','kef-f','aur'], stad:['bsi','sku','myr','fbp'], alles:BUS.map(b=>b.id)};
  const pts=ids[w].map(bpos); if(w!=='kef') pts.push(THUIS);
  dicht();
  kaart.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[28,150],paddingBottomRight:[28,120],maxZoom:16});
}
vin.addEventListener('click',e=>{ const b=e.target.closest('[data-kaart]'); if(b) toonKaart(b.dataset.kaart); });

teken();
posities(false);
}
